defaults:
  - /habitat: habitat_config_base
  - /habitat/task: pointnav
  - /habitat/simulator/agents:
    - rgbd_agent
  - /habitat/dataset/pointnav: gibson
  - _self_

# config values overrides:
habitat:
  environment:
    max_episode_steps: 500
  # YAML Configuration for Habitat Simulator and a Custom Agent

  simulator:
    scene: "data/scene_datasets/gibson/Cantwell.glb"    # Path to the scene file (modify if needed)
    enable_physics: false                                   # Disable physics simulation
    seed: 42                                                # Random seed for reproducibility

  agent:
    default_agent: 0                                        # The default agent index to be used
    action_space:
      move_forward: 0.25    # Fixed movement distance in meters
      rotate: 1.0           # Rotation factor (angle in degrees)

    sensor_settings:
      height: 256         # Sensor image height
      width: 256          # Sensor image width
      sensor_height: 0.15  # Height at which sensors are mounted on the agent

    sensors:
      # RGB Camera Sensor Specification
      - uuid: "color_sensor"
        sensor_type: "COLOR"
        sensor_subtype: "PINHOLE"
        resolution: [256, 256]
        position: [0.0, 0.15, 0.0]

      # Depth Sensor Specification
      - uuid: "depth_sensor"
        sensor_type: "DEPTH"
        sensor_subtype: "PINHOLE"
        resolution: [256, 256]
        position: [0.0, 0.15, 0.0]

      # IMU Sensor Specification
      - uuid: "imu_sensor"
        sensor_type: "IMU"
        sensor_subtype: "NONE"
        position: [0.0, 0.15, 0.0]

      # 2D LiDAR Sensor Specification
      - uuid: "lidar_2d"
        sensor_type: "DEPTH"
        sensor_subtype: "EQUIRECTANGULAR"
        resolution: [1, 360]          # 1 vertical line and 360 horizontal rays
        position: [0.0, 0.15, 0.0]      # Mounted 15 cm above ground
        hfov: 360                    # Full horizontal sweep (360 degrees)
        vfov: 0.1                    # Minimal vertical field of view
        near: 0.1
        far: 10.0

    agent_start_state:
      position: [-4.69643, 0.15825, -2.90618]   # Initial position of the agent in the scene

habitat_baselines:
  verbose: False
  trainer_name: "ppo"
  torch_gpu_id: 0
  tensorboard_dir: "tb"
  video_dir: "video_dir"
  # Evaluate on all episodes
  test_episode_count: -1
  eval_ckpt_path_dir: "data/new_checkpoints"
  num_environments: 6
  checkpoint_folder: "data/new_checkpoints"
  total_num_steps: 75e6
  log_interval: 25
  num_checkpoints: 100
  # Force PyTorch to be single threaded as
  # this improves performance considerably
  force_torch_single_threaded: True

  eval:
    video_option: [ ]
    # Can be uncommented to generate videos.
    # video_option: ["disk", "tensorboard"]

  rl:
    ppo:
      # ppo params
      clip_param: 0.2
      ppo_epoch: 4
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.5
      num_steps: 128
      hidden_size: 512
      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: True
      use_linear_lr_decay: True
      reward_window_size: 50

      # Use double buffered sampling, typically helps
      # when environment time is similar or larger than
      # policy inference time during rollout generation
      use_double_buffered_sampler: False
